[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrs"
version = "0.1.0"
description = "Reference-frame-robust encoding of time-indexed spatial relations"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "matplotlib==3.10.9",
  "scipy==1.15.3",
  "PyYAML==6.0.2",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
